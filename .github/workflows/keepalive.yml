name: Keep app alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL" || (echo "HEALTHCHECK_URL secret is not configured" && exit 1)
          curl -fsS "$HEALTHCHECK_URL" > /dev/null
